inputs:
  - type: elasticsearch/metrics
    id: elasticsearch-monitoring
    streams:
      - id: elasticsearch-ccr
        data_stream:
          type: metrics
          dataset: elasticsearch.stack_monitoring.ccr
        metricsets:
          - ccr
        period: 10s
        hosts: ["{{ .URL }}"]
        username: {{ .Username }}
        password: {{ sanitizeJSON .Password }}
        ssl.enabled: {{ .IsSSL }}
        ssl.verification_mode: "certificate"
        {{- with .CAVolume }}
        ssl.certificate_authorities: ["{{ CAPath . }}"]
        {{- end }}
        {{- with .ClientCertVolume }}
        ssl.certificate: "{{ ClientCertPath . }}"
        ssl.key: "{{ ClientKeyPath . }}"
        {{- end }}
      - id: elasticsearch-cluster_stats
        data_stream:
          type: metrics
          dataset: elasticsearch.stack_monitoring.cluster_stats
