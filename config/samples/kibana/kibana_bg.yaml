# Note: spec.backgroundTasks is an Enterprise feature and requires an Enterprise license to be installed in the operator.
# This sample sets up an Elasticsearch cluster and a Kibana with a dedicated pool of background task nodes.
# The primary Deployment serves the UI only. A second Deployment runs 2 background task nodes.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-sample
spec:
  version: 9.5.1
  nodeSets:
  - name: default
    count: 2
    config:
      node.store.allow_mmap: false
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana-sample
spec:
  version: 9.5.1
  count: 1
  elasticsearchRef:
    name: elasticsearch-sample
  backgroundTasks:
    count: 2
