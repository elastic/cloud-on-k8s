apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-sample
spec:
  version: 9.5.1
  nodeSets:
  - name: default
    count: 2
    config:
      node.store.allow_mmap: false
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana-sample
spec:
  version: 9.5.1
  count: 1
  elasticsearchRef:
    name: elasticsearch-sample
  backgroundTasks:
    count: 2
