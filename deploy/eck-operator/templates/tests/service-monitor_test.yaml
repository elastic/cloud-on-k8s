# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test operator service monitor
templates:
  - service-monitor.yaml
tests:
  - it: default service monitor 
    set:
      config:
        metrics:
          secureMode:
            enabled: true
    asserts:
      - template: service-monitor.yaml
        equal:
          path: spec
          value:
            endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              interval: 30s
              path: /metrics
              port: https
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
            namespaceSelector:
              matchNames:
              - NAMESPACE
            selector:
              matchLabels:
                app.kubernetes.io/instance: RELEASE-NAME
                app.kubernetes.io/name: elastic-operator-metrics-service 
      - template: service-monitor.yaml
        notExists:
          path: metadata.annotations
      - template: service-monitor.yaml
        equal:
          path: metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: elastic-operator
            app.kubernetes.io/version: 3.6.0-SNAPSHOT
            helm.sh/chart: eck-operator-3.6.0-SNAPSHOT
  - it: legacy values 
    set:
      config:
        metrics:
          secureMode:
            enabled: true
            tls:
              insecureSkipVerify: false
              caSecret: metrics-ca
              caMountDirectory: /etc/custom-ca/
    asserts:
      - template: service-monitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig
          value:
            caFile: /etc/custom-ca/metrics-ca/ca.crt
            insecureSkipVerify: false
            serverName: elastic-operator-metrics.NAMESPACE.svc
  - it: serviceMonitor values 
    set:
      config:
        metrics:
          secureMode: 
            enabled: true
      serviceMonitor:
        insecureSkipVerify: false
        caSecret: metrics-ca
        caMountDirectory: /etc/custom-ca/
    asserts:
      - template: service-monitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig
          value:
            caFile: /etc/custom-ca/metrics-ca/ca.crt
            insecureSkipVerify: false
            serverName: elastic-operator-metrics.NAMESPACE.svc
  - it: secure mode without service monitor 
    set:
      serviceMonitor:
        enabled: false
        labels:
          release: kube-prometheus-stack
        annotations:
          example.com/owner: platform
        interval: 60s
        scrapeTimeout: 15s
      config:
        metrics:
          secureMode: 
            enabled: true
    asserts:
      - template: service-monitor.yaml
        hasDocuments:
          count: 0
  - it: custom labels and annotations
    set:
      config:
        metrics:
          secureMode:
            enabled: true
      serviceMonitor:
        labels:
          release: kube-prometheus-stack
        annotations:
          example.com/owner: platform
    asserts:
      - template: service-monitor.yaml
        equal:
          path: metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: elastic-operator
            app.kubernetes.io/version: 3.6.0-SNAPSHOT
            helm.sh/chart: eck-operator-3.6.0-SNAPSHOT
            release: kube-prometheus-stack
      - template: service-monitor.yaml
        equal:
          path: metadata.annotations
          value:
            example.com/owner: platform
      - template: service-monitor.yaml
        equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: elastic-operator-metrics-service
  - it: custom label overrides a colliding chart label
    set:
      config:
        metrics:
          secureMode:
            enabled: true
      serviceMonitor:
        labels:
          app.kubernetes.io/name: custom-operator
    asserts:
      - template: service-monitor.yaml
        equal:
          path: metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: custom-operator
            app.kubernetes.io/version: 3.6.0-SNAPSHOT
            helm.sh/chart: eck-operator-3.6.0-SNAPSHOT
  - it: sets interval and scrape timeout
    set:
      config:
        metrics:
          secureMode:
            enabled: true
      serviceMonitor:
        interval: 60s
        scrapeTimeout: 15s
    asserts:
      - template: service-monitor.yaml
        equal:
          path: spec.endpoints[0].interval
          value: 60s
      - template: service-monitor.yaml
        equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 15s
  - it: empty interval keeps 30s and omits scrape timeout
    set:
      config:
        metrics:
          secureMode:
            enabled: true
      serviceMonitor:
        interval: ""
        scrapeTimeout: ""
    asserts:
      - template: service-monitor.yaml
        equal:
          path: spec.endpoints[0].interval
          value: 30s
      - template: service-monitor.yaml
        notExists:
          path: spec.endpoints[0].scrapeTimeout
  - it: custom namespace keeps the release namespace selector
    set:
      config:
        metrics:
          secureMode:
            enabled: true
      serviceMonitor:
        namespace: monitoring
    asserts:
      - template: service-monitor.yaml
        equal:
          path: metadata.namespace
          value: monitoring
      - template: service-monitor.yaml
        equal:
          path: spec.namespaceSelector.matchNames
          value:
            - NAMESPACE
  - it: secure mode disabled suppresses the service monitor
    set:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
        annotations:
          example.com/owner: platform
        interval: 60s
        scrapeTimeout: 15s
      config:
        metrics:
          secureMode:
            enabled: false
    asserts:
      - template: service-monitor.yaml
        hasDocuments:
          count: 0