steps:

  - group: "e2e-tests"
    steps:

      # for commits in main
      - label: ":buildkite: e2e"
        if: |
          build.branch == "main" && build.source != "schedule"
          && build.env("GITHUB_PR_TRIGGER_COMMENT") !~ /^buildkite test this -[fm]/
        command: |
          .buildkite/scripts/build/set-images.sh
          cd .buildkite/e2e/pipeline-gen && go build -o pipeline-gen
          cat <<DEF | ./pipeline-gen | buildkite-agent pipeline upload
          - label: gke/TestSmoke
            fixed:
              E2E_PROVIDER: gke
              TESTS_MATCH: TestSmoke
          - label: kind/TestSmoke
            fixed:
              E2E_PROVIDER: kind
              TESTS_MATCH: TestSmoke
          - label: aks/TestSmoke
            fixed:
              E2E_PROVIDER: aks
              TESTS_MATCH: TestSmoke
          - label: eks/TestSmoke
            fixed:
              E2E_PROVIDER: eks
              TESTS_MATCH: TestSmoke
          DEF
        agents:
          image: docker.elastic.co/ci-agent-images/cloud-k8s-operator/buildkite-agent:latest@sha256:10cd5aa62b5ad9800f25084cbf0b87133dd3d0868ccd3f26b038b88b616b33e6
          memory: "2G"

      # for nightly builds from main
      - label: ":buildkite: e2e"
        if: |
          ( build.branch == "main" && build.source == "schedule" )
          || build.message =~ /^buildkite test .*e2e\/all.*/
        command: |
          .buildkite/scripts/build/set-images.sh
          cd .buildkite/e2e/pipeline-gen && go build -o pipeline-gen
          cat ../nightly-main-matrix.yaml | ./pipeline-gen | buildkite-agent pipeline upload
        agents:
          image: docker.elastic.co/ci-agent-images/cloud-k8s-operator/buildkite-agent:latest@sha256:10cd5aa62b5ad9800f25084cbf0b87133dd3d0868ccd3f26b038b88b616b33e6
          memory: "2G"

      # for all tags
      - label: ":buildkite: e2e"
        if: build.tag != null
        command: |
          .buildkite/scripts/build/set-images.sh
          cd .buildkite/e2e/pipeline-gen && go build -o pipeline-gen
          cat ../release-branch-matrix.yaml | ./pipeline-gen | buildkite-agent pipeline upload
        agents:
          image: docker.elastic.co/ci-agent-images/cloud-k8s-operator/buildkite-agent:latest@sha256:10cd5aa62b5ad9800f25084cbf0b87133dd3d0868ccd3f26b038b88b616b33e6
          memory: "2G"
